system:
  generic:
    hostnames: ['.*']
    moduletool: lmod
    poolsize: 1
    testdir: /tmp/buildtest
    paths:
      slurm: /usr/bin
    report:
      format: "name,id,state,runtime,returncode"
    executors:
      defaults:
        pollinterval: 1
        maxpendtime: 30
      local:
        bash:
          shell: bash
      slurm:
        ci:
          partition: cpu
          options: ["-N 1", "-n 1"]
