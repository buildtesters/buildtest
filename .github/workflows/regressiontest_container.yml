name: Regression Test in Container

on:
  workflow_run:
    workflows: ["Build Container"]
    types: [completed]
    branches: [devel]

jobs:
  buildtest_tutorial_container:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/buildtest_spack:spack-sc25-${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out the built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Regression test in container
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${IMAGE}"
          docker run --rm \
            --platform linux/amd64 \
            --user spack \
            -v "${GITHUB_WORKSPACE}:/home/spack/buildtest" \
            -w /home/spack/buildtest \
            "${IMAGE}" \
            bash -lc '
              set +e
              . /etc/profile
              which csh zsh
              module load python
              python3 -m venv env
              source env/bin/activate
              source setup.sh
              python $BUILDTEST_ROOT/buildtest/tools/unittests.py -c --pytest="-m spack"
              returncode=$?
              if [ $returncode != 0 ]; then exit $returncode; fi
            '

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
