name: Regression Test in Container

on:
  workflow_run:
    workflows: ["Build Container"]
    types: [completed]

jobs:
  buildtest_tutorial_container:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/${{ github.repository_owner }}/buildtest_spack:spack-sc25
      options: "-it --user root"
    steps:
      - name: Check out the PR revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Regression test in container
        shell: bash
        run: |
          set +xe
          . /etc/profile
          which csh zsh
          module load python
          python3 -m venv env
          source env/bin/activate
          source setup.sh
          python $BUILDTEST_ROOT/buildtest/tools/unittests.py -c --pytest="-m spack"
          returncode=$?
          if [ $returncode != 0 ]; then exit $returncode; fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
