buildspecs:
  post_run_example:
    type: script
    executor: generic.local.bash
    description: post run example that will remove symbolic link
    run: |
      ln -s $HOME/.bashrc $HOME/.bashrc_link
      mkdir -v demo
    post_run: |
      unlink $HOME/.bashrc_link
      rmdir -v demo
    status:
      is_dir:
        - demo
      is_symlink:
        - $HOME/.bashrc_link
